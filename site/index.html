    .concept-switch b,.concept-switch small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.concept-switch b{font-size:13px}.concept-switch small{margin-top:1px;color:var(--muted);font-size:10.5px}

    .side-logo b{display:block;letter-spacing:.15em;font-size:14px}.side-logo small{display:block;margin-top:2px;color:var(--muted);font-size:11px}

        <button type="button" data-concept-button="edition" onclick="setConcept('edition')"><span class="concept-no">B</span><span><b>Clubhouse Edition</b><small>밝은 골프 에디토리얼</small></span></button>
        <button type="button" data-concept-button="motion" onclick="setConcept('motion')"><span class="concept-no">C</span><span><b>Motion Lab</b><small>영상 우선 코칭 콕핏</small></span></button>

    function render(historyMode='replace'){
      if(page!=='studio')stopPlayback();
      document.documentElement.dataset.concept=concept;
      document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#F2F7FF';
      document.querySelectorAll('[data-concept-button]').forEach(button=>{
        const active=button.dataset.conceptButton===concept;
        button.classList.toggle('on',active);
        button.setAttribute('aria-pressed',String(active));
      });
      document.getElementById('app').innerHTML=`<div class="app-shell">${side()}<div class="app-main">${header()}${content()}</div></div>`;
      document.getElementById('mobile-nav').innerHTML=navButtons(true);
      if(concept==='hybrid')decorateHybrid();
      bindSpotlights();
      bindDemoInteractions();
      syncUrl(historyMode);
      document.getElementById('status-message').textContent=`${conceptNames[concept]} · ${labels[page]} 화면`;
    }
    function syncUrl(mode='replace'){
      if(mode==='none')return;
      const u=new URL(location.href);u.searchParams.set('concept',concept);u.searchParams.set('page',page);
      history[mode==='push'?'pushState':'replaceState']({concept,page},'',u);
    }
    function bindSpotlights(){
      if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
      document.querySelectorAll('[data-spotlight]').forEach(el=>el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();el.style.setProperty('--mx',`${e.clientX-r.left-130}px`);el.style.setProperty('--my',`${e.clientY-r.top-130}px`)}));
    }
    function makeInteractive(el,action,label){
      if(!el)return;el.dataset.interactive='true';el.tabIndex=0;el.setAttribute('role','button');if(label)el.setAttribute('aria-label',label);
      el.addEventListener('click',action);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(e)}});
    }
    function bindDemoInteractions(){
      document.querySelectorAll('.athlete-rail button,.passport,.member-index button').forEach((button,i)=>button.setAttribute('aria-pressed',String(button.classList.contains('on'))));
      const jobs=[...document.querySelectorAll('.job')];
      jobs.forEach((button,i)=>{
        button.setAttribute('aria-selected',String(i===selectedJob));
        button.addEventListener('click',()=>{selectedJob=i;selectedMember=Math.min(i,memberProfiles.length-1);render('replace');requestAnimationFrame(()=>document.querySelectorAll('.job')[i]?.focus());showToast('영상 작업을 전환했습니다',memberProfiles[selectedMember].name+' 회원의 코칭 맥락을 불러왔습니다.')});
      });
      if(concept!=='hybrid')return;
      const tasks=[...document.querySelectorAll('.task-row')];
      makeInteractive(tasks[0],completeJournal,'레슨일지 한 건 완료 처리');
      makeInteractive(tasks[1],()=>setPage('studio'),'영상 검토 화면 열기');
      makeInteractive(tasks[2],()=>setPage('members'),'재등록 후보 회원 열기');
      const metrics=[...document.querySelectorAll('.pulse-strip .metric')];
      makeInteractive(metrics[1],completeJournal,'일지 대기 처리');

      makeInteractive(readiness[3],()=>setPage('studio'),'영상 대기 목록 열기');
      if(page==='members'){
        const openStudio=document.querySelector('.trajectory-stage .btn.primary');
        openStudio?.addEventListener('click',e=>{e.stopImmediatePropagation();selectedJob=Math.min(selectedMember,3);setPage('studio')},{capture:true});
        document.querySelectorAll('.clip-card').forEach(button=>button.addEventListener('click',e=>{e.stopImmediatePropagation();selectedJob=Math.min(selectedMember,3);setPage('studio')},{capture:true}));
        const viz=document.querySelector('.trajectory-viz');
        if(viz){viz.setAttribute('role','button');viz.setAttribute('aria-label','궤적 위 코칭 지점 선택');viz.tabIndex=0;viz.insertAdjacentHTML('beforeend','<i class="trajectory-probe" aria-hidden="true"></i><span class="trajectory-hint">눌러서 코칭 지점을 확인하세요</span>');const probe=e=>{const r=viz.getBoundingClientRect(),x=Math.max(8,Math.min(92,((e.clientX-r.left)/r.width)*100)),y=Math.max(8,Math.min(82,((e.clientY-r.top)/r.height)*100));viz.style.setProperty('--probe-x',x+'%');viz.style.setProperty('--probe-y',y+'%');showToast('코칭 지점을 표시했습니다',`궤적 ${Math.round(x)}% · 높이 ${Math.round(100-y)}%`)};viz.addEventListener('click',probe);viz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();viz.style.setProperty('--probe-x','64%');viz.style.setProperty('--probe-y','34%');showToast('코칭 지점을 표시했습니다','키보드 기준 지점을 선택했습니다.')}})}
      }
    }
    function addMagicEdge(target,variant='beam'){
      if(!target||target.querySelector(':scope > .magic-edge'))return;
      target.insertAdjacentHTML('beforeend',`<i class="magic-edge ${variant==='shine'?'shine':''}" aria-hidden="true"></i>`);
    }
    function bindMagicLens(stage){
      if(!stage||stage.dataset.lensBound)return;stage.dataset.lensBound='true';
      if(!stage.querySelector('.magic-lens'))stage.insertAdjacentHTML('beforeend','<i class="magic-lens" aria-hidden="true"></i>');
      if(matchMedia('(hover:hover) and (pointer:fine)').matches){
        stage.addEventListener('pointermove',e=>{if(videoPlaying&&page==='studio')return;const r=stage.getBoundingClientRect();stage.style.setProperty('--lens-x',Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100))+'%');stage.style.setProperty('--lens-y',Math.max(12,Math.min(88,(e.clientY-r.top)/r.height*100))+'%');stage.classList.add('lens-hover')});
        stage.addEventListener('pointerleave',()=>stage.classList.remove('lens-hover'));
      }
      stage.classList.toggle('lens-locked',lensLocked);
    }
    function decorateMagicUI(){
      const view=document.querySelector('.hybrid-view');if(!view)return;
      [...view.querySelectorAll('.card,.section-head')].forEach((el,i)=>{el.classList.add('magic-reveal');el.style.setProperty('--reveal-delay',Math.min(i,7)*48+'ms')});
      view.querySelectorAll('.metric>b,.readiness-orbit b,.trajectory-stats b,.stage-label').forEach(el=>el.classList.add('number-ticker'));
      view.querySelectorAll('.task-row,.job,.clip-card').forEach((el,i)=>el.style.setProperty('--item-index',i));
      view.querySelectorAll('.btn:not(.primary):has(svg)').forEach(el=>el.classList.add('magic-hover'));
      [...view.querySelectorAll('.status.live')].slice(0,2).forEach(el=>el.classList.add('magic-pulse'));
      if(page==='home'){
        const hero=view.querySelector('.pulse-hero');if(hero&&!hero.querySelector('.magic-grid'))hero.insertAdjacentHTML('afterbegin','<i class="magic-grid" aria-hidden="true"></i>');
        addMagicEdge(view.querySelector('.lesson-deck'));
        view.querySelector('.hero-actions .btn.primary')?.classList.add('magic-shimmer');
        hero?.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--grid-x',(e.clientX-r.left)/r.width*100+'%');hero.style.setProperty('--grid-y',(e.clientY-r.top)/r.height*100+'%')});
      }
      if(page==='schedule'){
        addMagicEdge(view.querySelector('.event'),'shine');
        view.querySelector('.week-top .btn.primary')?.classList.add('magic-shimmer');
        view.querySelector('.schedule-aside .agenda-card:last-child h3')?.classList.add('magic-highlight');
      }
      if(page==='members'){
        const stage=view.querySelector('.trajectory-stage');addMagicEdge(stage);bindMagicLens(view.querySelector('.trajectory-viz'));
        stage?.classList.add('magic-tilt');
        if(stage&&matchMedia('(hover:hover) and (pointer:fine)').matches){stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;stage.style.setProperty('--tilt-x',(x*1.4).toFixed(2)+'deg');stage.style.setProperty('--tilt-y',(-y*1.1).toFixed(2)+'deg')});stage.addEventListener('pointerleave',()=>{stage.style.setProperty('--tilt-x','0deg');stage.style.setProperty('--tilt-y','0deg')})}
      }
      if(page==='studio'){
        const player=view.querySelector('.studio-player');player?.classList.add('magic-backlight');addMagicEdge(player,'shine');
        view.querySelector('.pipeline')?.classList.add('magic-pipeline');
        view.querySelector('.studio-actions .btn.primary')?.classList.add('magic-shimmer');
        bindMagicLens(view.querySelector('.swing-stage'));
      }
    }
    function decorateHybrid(){
      if(page==='studio'){
        const member=activeMember();
        const jobs=[...document.querySelectorAll('.job')];
        jobs.forEach((job,i)=>{const profile=i===selectedJob?member:(memberProfiles[i]||member);const title=job.querySelector('b');if(title)title.textContent=`${profile.name} · ${profile.track}`;job.classList.toggle('on',i===selectedJob);job.setAttribute('aria-selected',String(i===selectedJob))});
        const playerTitle=document.querySelector('.player-top b');if(playerTitle)playerTitle.textContent=`${member.name} · Face-On`;
        const focus=document.querySelector('.studio-inspector .focus-one h3');if(focus)focus.textContent=member.focus;
        document.querySelectorAll('.scrub-steps button').forEach((button,i)=>{if(i===studioStep)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current')});
        const actionButtons=[...document.querySelectorAll('.studio-actions .btn')];if(actionButtons[0])actionButtons[0].disabled=studioStep===0;if(actionButtons[1])actionButtons[1].disabled=studioStep===4;
        installPlaybackControls();
      }
      decorateMagicUI();
    }
    function installPlaybackControls(){
      const player=document.querySelector('.studio-player'),stage=document.querySelector('.swing-stage'),scrubber=document.querySelector('.scrubber');if(!player||!stage||!scrubber)return;
      stage.insertAdjacentHTML('beforeend',`<i class="compare-slice" aria-hidden="true"></i>`);
      scrubber.insertAdjacentHTML('beforebegin',`<div class="playback-bar" aria-label="영상 재생 컨트롤"><button id="play-toggle" type="button" onclick="togglePlayback()" aria-pressed="${videoPlaying}">${videoPlaying?'Ⅱ 일시정지':'▶ 재생'}</button><button type="button" onclick="stepFrame(-1)" aria-label="이전 프레임">−1F</button><input id="frame-slider" type="range" min="0" max="240" value="${videoFrame}" aria-label="영상 프레임"><button type="button" onclick="stepFrame(1)" aria-label="다음 프레임">+1F</button><button class="speed-control" type="button" onclick="cycleSpeed()" aria-label="재생 속도">${videoSpeed}×</button><button class="lens-toggle ${lensLocked?'on':''}" type="button" onclick="toggleLens()" aria-pressed="${lensLocked}">⌕ 프레임 확대</button></div><label class="compare-control"><span>이전 스윙</span><input id="compare-slider" type="range" min="12" max="88" value="${compareValue}" aria-label="이전 스윙과 현재 스윙 비교"><span>현재 스윙</span></label>`);
      document.getElementById('frame-slider')?.addEventListener('input',e=>{videoFrame=Number(e.target.value);updatePlaybackUI()});
      document.getElementById('compare-slider')?.addEventListener('input',e=>{compareValue=Number(e.target.value);updatePlaybackUI()});
      updatePlaybackUI();
    }
    function updatePlaybackUI(){
      const player=document.querySelector('.studio-player'),stage=document.querySelector('.swing-stage'),label=document.querySelector('.stage-label'),frame=document.getElementById('frame-slider'),compare=document.getElementById('compare-slider'),play=document.getElementById('play-toggle');
      player?.classList.toggle('is-playing',videoPlaying);if(stage)stage.style.setProperty('--compare',compareValue+'%');if(label)label.textContent=`IMPACT · ${videoFrame}F`;if(frame)frame.value=String(videoFrame);if(compare)compare.value=String(compareValue);if(play){play.textContent=videoPlaying?'Ⅱ 일시정지':'▶ 재생';play.classList.toggle('playing',videoPlaying);play.setAttribute('aria-pressed',String(videoPlaying))}
    }
    function stopPlayback(){videoPlaying=false;if(playbackTimer){clearInterval(playbackTimer);playbackTimer=null}updatePlaybackUI()}
    window.togglePlayback=()=>{videoPlaying=!videoPlaying;if(playbackTimer){clearInterval(playbackTimer);playbackTimer=null}if(videoPlaying)playbackTimer=setInterval(()=>{videoFrame=videoFrame>=240?0:videoFrame+1;updatePlaybackUI()},Math.max(70,280/videoSpeed));updatePlaybackUI();document.getElementById('status-message').textContent=videoPlaying?'영상 재생':'영상 일시정지'};
    window.stepFrame=delta=>{videoFrame=Math.max(0,Math.min(240,videoFrame+delta));updatePlaybackUI()};
    window.cycleSpeed=()=>{videoSpeed=videoSpeed===.5?1:videoSpeed===1?2:.5;if(videoPlaying){stopPlayback();togglePlayback()}else updatePlaybackUI();showToast('재생 속도를 바꿨습니다',videoSpeed+'배속')};
    window.toggleLens=()=>{lensLocked=!lensLocked;const stage=document.querySelector('.swing-stage'),button=document.querySelector('.lens-toggle');stage?.classList.toggle('lens-locked',lensLocked);button?.classList.toggle('on',lensLocked);button?.setAttribute('aria-pressed',String(lensLocked));showToast(lensLocked?'프레임 확대를 켰습니다':'프레임 확대를 껐습니다',lensLocked?'방향키로 프레임을 바꾸며 임팩트 지점을 확인하세요.':'기본 영상 화면으로 돌아왔습니다.')};
    function centerConceptButton(){const strip=document.querySelector('.concept-switch'),target=document.querySelector(`[data-concept-button="${concept}"]`);if(!strip||!target||strip.scrollWidth<=strip.clientWidth)return;strip.scrollTo({left:target.offsetLeft-(strip.clientWidth-target.offsetWidth)/2,behavior:'smooth'})}
    window.setConcept=next=>{if(!concepts.includes(next))return;concept=next;page='home';render('push');requestAnimationFrame(centerConceptButton);scrollTo({top:0,behavior:'smooth'})};
    window.setPage=next=>{if(!pages.includes(next))return;if(next!=='studio')stopPlayback();page=next;render('push');scrollTo({top:0,behavior:'smooth'})};
    window.selectMember=i=>{selectedMember=Math.max(0,Math.min(4,i));render('replace');requestAnimationFrame(()=>document.querySelector('.athlete-rail button.on,.passport.on,.member-index button.on')?.focus())};
    window.selectStudioJob=i=>{selectedJob=Math.max(0,Math.min(3,i));selectedMember=Math.min(selectedJob,memberProfiles.length-1);render('replace')};
    window.setStudioStep=i=>{studioStep=Math.max(0,Math.min(4,i));render('replace');requestAnimationFrame(()=>document.querySelector('.scrub-steps [aria-current="step"]')?.focus())};
    function showToast(title,detail,undo=false){
      const region=document.getElementById('toast-region');clearTimeout(toastTimer);region.innerHTML=`<div class="toast" role="status"><i>✓</i><span><b>${title}</b><span>${detail}</span></span>${undo?'<button type="button" onclick="undoLastAction()">되돌리기</button>':'<button type="button" aria-label="알림 닫기" onclick="this.closest(\'.toast\').remove()">닫기</button>'}</div>`;toastTimer=setTimeout(()=>{region.innerHTML=''},undo?8000:4200);
    }
    function completeJournal(){
      if(journalPending<=0){showToast('모든 일지를 마쳤습니다','현재 대기 중인 레슨일지가 없습니다.');return}
      journalPending-=1;operatingScore=Math.min(100,operatingScore+4);undoState={type:'journal'};render('replace');showToast('레슨일지 1건을 완료했습니다',`대기 ${journalPending}건 · 운영 점수 ${operatingScore}점`,true);
    }
    window.undoLastAction=()=>{if(!undoState)return;if(undoState.type==='journal'){journalPending+=1;operatingScore=Math.max(0,operatingScore-4)}undoState=null;render('replace');showToast('변경을 되돌렸습니다',`일지 대기 ${journalPending}건 · 운영 점수 ${operatingScore}점`)};
    const commandItems=()=>[
      {id:'home',icon:'⌂',label:'홈 대시보드',detail:'오늘의 운영 흐름과 다음 행동',keys:'G H'},
      {id:'schedule',icon:'日',label:'오늘 스케줄',detail:'주간 타석과 13:00 다음 레슨',keys:'G S'},
      {id:'studio',icon:'▶',label:'영상 검토 4건',detail:'선택 회원의 Motion Studio 열기',keys:'G V'},
      {id:'journal',icon:'✓',label:'레슨일지 한 건 완료',detail:`대기 ${journalPending}건 · 점수 ${operatingScore}`,keys:'A J'},
      {id:'new',icon:'＋',label:'새 레슨 만들기',detail:'빈 타석을 확인하고 예약 시작',keys:'N'},
      ...memberProfiles.map((m,i)=>({id:`member-${i}`,icon:m.name[0],label:`${m.name} 회원`,detail:`${m.track} · ${m.next}`,keys:'회원'}))
    ];
    function renderCommandResults(query=''){
      const q=query.trim().toLowerCase(),items=commandItems().filter(item=>!q||`${item.label} ${item.detail}`.toLowerCase().includes(q));commandIndex=Math.max(0,Math.min(commandIndex,Math.max(0,items.length-1)));visibleCommandIds=items.map(item=>item.id);
      document.getElementById('command-list').innerHTML=items.length?items.map((item,i)=>`<button class="command-item ${i===commandIndex?'active':''}" type="button" role="option" aria-selected="${i===commandIndex}" onclick="runCommand('${item.id}')"><i>${item.icon}</i><span><b>${item.label}</b><span>${item.detail}</span></span><kbd>${item.keys}</kbd></button>`).join(''):'<div class="command-empty">일치하는 빠른 실행이 없습니다.</div>';
    }
    function setBackgroundInert(inert){['.lab-top','#app','#mobile-nav'].forEach(selector=>{const el=document.querySelector(selector);if(!el)return;inert?el.setAttribute('inert',''):el.removeAttribute('inert')})}
    window.openCommand=()=>{if(document.getElementById('command-layer').classList.contains('open'))return;lastFocus=document.activeElement;commandIndex=0;const layer=document.getElementById('command-layer'),search=document.getElementById('command-search');layer.classList.add('open');setBackgroundInert(true);document.body.style.overflow='hidden';search.value='';renderCommandResults();requestAnimationFrame(()=>search.focus())};
    window.closeCommand=(restore=true)=>{const layer=document.getElementById('command-layer');if(!layer.classList.contains('open'))return;layer.classList.remove('open');setBackgroundInert(false);document.body.style.overflow='';if(restore)lastFocus?.focus?.();lastFocus=null};
    window.runCommand=id=>{closeCommand(false);if(id==='home')return setPage('home');if(id==='schedule')return setPage('schedule');if(id==='studio'){selectedJob=Math.min(selectedMember,3);return setPage('studio')}if(id==='journal')return completeJournal();if(id==='new')return openDialog('new');if(id.startsWith('member-')){selectedMember=Math.max(0,Math.min(4,Number(id.split('-')[1])));return setPage('members')}};
    const dialogData={
      profile:['김도현 프로','프로필 완성도 92%','전문 분야 드라이버·아이언 · 경력 7년 · 오늘 레슨 3건'],
      score:['운영 점수 82점','좋음 80점 이상 · 확인 60–79점','일지 마감 30%, 일정 확정 25%, 영상 검토 20%, 회원 후속 25%로 구성한 편집 가능한 골프스팟 기준입니다.'],
      lesson:['13:00 김민서 회원','2번 타석 · 60분 · 영상 동의 완료','최근 초점은 임팩트 직전 페이스 정렬입니다. 지난 영상 3개와 일지 2개를 세션 덱에 묶었습니다.'],
      member:['회원 성장 기록','최근 8회 중 7회 출석','목표·영상·일지·상담을 한 시간축으로 확인하고 다음 레슨의 초점을 하나로 고정합니다.'],
      task:['처리함','일지 2건 · 영상 4건 · 재등록 2명','마감이 가까운 순서로 정렬했습니다. 자동 발송이나 자동 판단은 하지 않습니다.'],
      schedule:['예약 상세','60분 레슨 · 담당 김도현 프로','다른 프로에게는 회원명 없이 시간·길이·타석만 점유 상태로 보입니다.'],
      new:['새 레슨 만들기','빈 타석 확인 완료','회원과 시간을 고르면 겹치는 타석을 다시 확인한 뒤 저장하는 흐름입니다.'],
      gap:['공실 후보 2명','17:00–19:00 · 대기 회원과 일치','김민서 회원과 정하은 회원의 선호 시간대가 겹칩니다. 연락은 프로가 최종 확인합니다.']
    };
    window.openDialog=kind=>{const base=dialogData[kind]||dialogData.task,d=kind==='score'&&concept==='hybrid'?['운영 점수 '+operatingScore+'점','좋음 80점 이상 · 확인 60–79점',`현재 일지 대기 ${journalPending}건입니다. 일지 완료 30%, 일정 확정 25%, 영상 검토 20%, 회원 후속 25%로 구성한 편집 가능한 기준입니다.`]:base;lastFocus=document.activeElement;document.getElementById('dialog-title').textContent=d[0];document.getElementById('dialog-body').innerHTML=`<div class="dialog-copy"><b style="display:block;color:var(--ink);margin-bottom:5px">${d[1]}</b>${d[2]}</div><div class="dialog-grid"><div><b>지금 확인</b><span>가명 샘플 기준으로 상세 맥락을 보여줍니다.</span></div><div><b>다음 행동</b><span>프로가 확인한 뒤에만 실제 상태를 바꿉니다.</span></div></div><button class="btn primary" type="button" onclick="closeDialog()">확인했습니다</button>`;document.getElementById('dialog-layer').classList.add('open');setBackgroundInert(true);document.body.style.overflow='hidden';document.querySelector('.dialog-close').focus()};
    window.closeDialog=()=>{const layer=document.getElementById('dialog-layer');if(!layer.classList.contains('open'))return;layer.classList.remove('open');setBackgroundInert(false);document.body.style.overflow='';lastFocus?.focus?.();lastFocus=null};
    const commandSearch=document.getElementById('command-search');
    commandSearch.addEventListener('input',e=>{commandIndex=0;renderCommandResults(e.target.value)});
    commandSearch.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();commandIndex=Math.max(0,Math.min(visibleCommandIds.length-1,commandIndex+(e.key==='ArrowDown'?1:-1)));renderCommandResults(commandSearch.value)}else if(e.key==='Enter'&&visibleCommandIds[commandIndex]){e.preventDefault();runCommand(visibleCommandIds[commandIndex])}else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeCommand()}});
    function trapFocus(layer,e){const focusable=[...layer.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    addEventListener('keydown',e=>{
      const commandLayer=document.getElementById('command-layer'),dialogLayer=document.getElementById('dialog-layer');
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandLayer.classList.contains('open')?closeCommand():openCommand();return}
      if(commandLayer.classList.contains('open')){if(e.key==='Escape')closeCommand();if(e.key==='Tab')trapFocus(commandLayer,e);return}
      if(dialogLayer.classList.contains('open')){if(e.key==='Escape')closeDialog();if(e.key==='Tab')trapFocus(dialogLayer,e);return}
      if((e.ctrlKey||e.metaKey)&&['1','2','3','4'].includes(e.key)){e.preventDefault();setConcept(concepts[Number(e.key)-1]);return}
      if(concept==='hybrid'&&page==='studio'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){const key=e.key.toLowerCase();if(e.key===' '||key==='k'){e.preventDefault();togglePlayback()}else if(e.key==='ArrowLeft'){e.preventDefault();stepFrame(-1)}else if(e.key==='ArrowRight'){e.preventDefault();stepFrame(1)}else if(key==='j'){e.preventDefault();stepFrame(-10)}else if(key==='l'){e.preventDefault();stepFrame(10)}}
    });
    addEventListener('popstate',()=>{const stateUrl=new URL(location.href),nextConcept=stateUrl.searchParams.get('concept'),nextPage=stateUrl.searchParams.get('page');if(concepts.includes(nextConcept))concept=nextConcept;if(pages.includes(nextPage))page=nextPage;render('none')});
    addEventListener('pointerdown',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const button=e.target.closest('button');if(!button||button.disabled)return;const r=button.getBoundingClientRect(),ripple=document.createElement('i');ripple.className='ripple';ripple.style.left=(e.clientX-r.left)+'px';ripple.style.top=(e.clientY-r.top)+'px';button.appendChild(ripple);setTimeout(()=>ripple.remove(),600)});
    render('replace');
  })();
  </script>
